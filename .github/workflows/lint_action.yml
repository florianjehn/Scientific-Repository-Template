name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run isort
        run: uv run isort --check-only --profile black --line-length 88 src tests

      - name: Run Black
        run: uv run black --check --line-length 88 src tests

      - name: Run Flake8
        run: uv run flake8 --extend-ignore=E203 --max-line-length=88 src tests
